// ========== BOT WA PARSER ==========
function parseWaMessage(body, sender) {
  const text = body.trim();
  const lower = text.toLowerCase();

  // STATUS query
  const statusMatch = text.match(/(?:#status|\/status|status)\s+(LI-\d{4}-\d{4})/i);
  if (statusMatch) {
    return { type:'status_query', ticketNomor: statusMatch[1].toUpperCase() };
  }

  // UPDATE
  if (/^(#update|\/update|update)\s+LI-\d{4}-\d{4}/i.test(text)) {
    const ticketMatch = text.match(/LI-\d{4}-\d{4}/i);
    const isSelesai = /\b(selesai|done|beres|tuntas|kelar)\b/i.test(text);
    return { type:'update', ticketNomor: ticketMatch?.[0].toUpperCase(), isSelesai, note: text };
  }

  // INTAKE (lapor)
  if (/^(#lapor|\/lapor|lapor[:\s])/i.test(text)) {
    const content = text.replace(/^(#lapor|\/lapor|lapor[:\s])\s*/i, '').trim();

    // Detect kelurahan / kecamatan
    let kelurahan = null, kecamatan = sender?.kecamatan || null;
    for (const kec of Object.keys(KELURAHAN_BY_KEC)) {
      for (const kel of KELURAHAN_BY_KEC[kec]) {
        if (lower.includes(kel.toLowerCase())) { kelurahan = kel; kecamatan = kec; break; }
      }
      if (kelurahan) break;
    }
    if (!kelurahan && kecamatan) {
      kelurahan = KELURAHAN_BY_KEC[kecamatan][0];
    }
    if (!kecamatan) { kecamatan = 'Kebon Jeruk'; kelurahan = KELURAHAN_BY_KEC[kecamatan][0]; }

    // Detect kategori by keywords
    const keywordMap = {
      'inf_pju':   ['lampu','pju','penerangan','lampu jalan'],
      'inf_jalan': ['jalan','aspal','bolong','lubang','trotoar','jembatan'],
      'inf_dren':  ['drainase','got','saluran','gorong'],
      'lng_smph':  ['sampah','tps','kebersihan'],
      'lng_banj':  ['banjir','genangan','air masuk','rob'],
      'adm_ktp':   ['ktp','kk','adminduk','akta','dukcapil'],
      'pend_kjp':  ['kjp','ppdb','sekolah','pendidikan'],
      'kes_bpjs':  ['bpjs','puskesmas','rumah sakit','kesehatan','jkn'],
      'sos_bsn':   ['bansos','bantuan sosial','sembako'],
    };
    let kategori = 'lain';
    for (const [katId, kws] of Object.entries(keywordMap)) {
      if (kws.some(kw => lower.includes(kw))) { kategori = katId; break; }
    }

    // Prioritas heuristic
    let prioritas = 'Sedang';
    if (/\b(banjir|darurat|kritis|urgent|bahaya|mendesak|roboh)\b/i.test(text)) prioritas = 'Tinggi';
    if (/\b(banjir besar|kritis sekali|bencana)\b/i.test(text)) prioritas = 'Kritis';

    const lines = content.split('\n').filter(Boolean);
    const judul = (lines[0] || content).substring(0, 80);

    return { type:'intake', judul, deskripsi: content, kategori, kecamatan, kelurahan, prioritas };
  }

  // MENU / HELP
  if (/^(menu|help|bantuan|panduan|\?)$/i.test(text)) return { type:'menu' };

  return { type:'unknown' };
}

  const resetData = () => { localStorage.removeItem(KEY); window.location.reload(); };

  const openTicket = (id) => { setSelectedTicketId(id); setPage('detail'); };
  const goBack = () => { setSelectedTicketId(null); setPage('aduan'); };

  // Pages by role (RBAC)
  const allPages = [
    { id:'dashboard', label:'Dashboard',       icon:'📊', roles:['*'] },
    { id:'aduan',     label:'Daftar Aduan',    icon:'📋', roles:['*'] },
    { id:'tugas',     label:'Tugas Saya',      icon:'✅', roles:['pic','pj_kecamatan','koordinator','lo_dinas','admin_kantor'] },
    { id:'baru',      label:'Tiket Baru',      icon:'➕', roles:['admin_kantor','pic','pj_kecamatan','koordinator','lo_dinas'] },
    { id:'poin',      label:'Poin & Insentif', icon:'⭐', roles:['*'] },
    { id:'sosmed',    label:'Antrian Sosmed',  icon:'📱', roles:['sosmed','koordinator','admin_kantor','owner','super_admin'] },
    { id:'pigura',    label:'Antrian Pigura',  icon:'🖼️', roles:['pigura','koordinator','admin_kantor','owner','super_admin'] },
    { id:'bot',       label:'Bot WA Simulator',icon:'🤖', roles:['admin_kantor','koordinator','owner','super_admin'] },
    { id:'pengaturan',label:'Pengaturan',      icon:'⚙️', roles:['super_admin','koordinator','admin_kantor','owner'] },
  ];
  const visiblePages = allPages.filter(p => p.roles.includes('*') || p.roles.includes(currentUser.peran));

  return (
    <div className="min-h-screen flex flex-col">
      <div className="demo-banner border-b border-amber-300 px-4 py-2 text-sm flex items-center justify-between">
        <div>
          <strong>PROTOTYPE DEMO</strong> · Data tersimpan di browser ini saja.
          <span className="hidden sm:inline ml-2 text-slate-600">Ganti user di pojok kanan atas untuk simulasi peran berbeda.</span>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setShowHelp(true)} className="text-amber-800 hover:underline">Panduan</button>
          <button onClick={() => { if(confirm('Reset semua data prototype ke contoh awal?')) resetData(); }} className="text-rose-700 hover:underline">Reset</button>
        </div>
      </div>

      <header className="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-rose-500 to-rose-700 text-white flex items-center justify-center font-bold">LI</div>
          <div>
            <div className="font-semibold text-slate-800">LaporIma</div>
            <div className="text-xs text-slate-500">Tim Ima Mahdiah · DPRD DKI Jakarta · Dapil 10 (Jakbar)</div>
          </div>
        </div>
        <UserSwitcher currentUserId={store.currentUserId} setUser={setUser} />
      </header>

      <div className="flex flex-1">
        <aside className="bg-white border-r border-slate-200 w-56 hidden md:block">
          <nav className="p-3 space-y-1">
            {visiblePages.map(p => (
              <button key={p.id} onClick={() => { setPage(p.id); setSelectedTicketId(null); }}
                className={`w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 text-sm transition ${page === p.id ? 'bg-rose-50 text-rose-700 font-semibold' : 'text-slate-700 hover:bg-slate-50'}`}>
                <span>{p.icon}</span>{p.label}
              </button>
            ))}
          </nav>
          <div className="p-3 border-t border-slate-200 text-xs text-slate-500">
            <div className="font-medium">{currentUser.label}</div>
            <div>Tier: {isOffice(currentUser.peran) ? 'Office (Full Akses)' : isField(currentUser.peran) ? 'Field (Operasional)' : 'Khusus'}</div>
          </div>
        </aside>

        <div className="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200 flex overflow-x-auto">
          {visiblePages.slice(0,5).map(p => (
            <button key={p.id} onClick={() => { setPage(p.id); setSelectedTicketId(null); }}
              className={`flex-1 min-w-fit px-3 py-2 text-xs flex flex-col items-center gap-0.5 ${page === p.id ? 'text-rose-700' : 'text-slate-600'}`}>
              <span className="text-lg">{p.icon}</span>{p.label}
            </button>
          ))}
        </div>

        <main className="flex-1 p-4 md:p-6 pb-20 md:pb-6 overflow-x-hidden">
          {page === 'dashboard' && <Dashboard store={store} currentUser={currentUser} openTicket={openTicket} />}
          {page === 'aduan'     && <DaftarAduan store={store} currentUser={currentUser} openTicket={openTicket} />}
          {page === 'tugas'     && <TugasSaya store={store} currentUser={currentUser} openTicket={openTicket} />}
          {page === 'baru'      && <FormBaru store={store} update={update} currentUser={currentUser} onCreated={openTicket} />}
          {page === 'detail'    && <DetailTiket store={store} update={update} ticketId={selectedTicketId} currentUser={currentUser} goBack={goBack} />}
          {page === 'poin'      && <PoinSaya store={store} update={update} currentUser={currentUser} />}
          {page === 'sosmed'    && <AntrianSosmed store={store} update={update} currentUser={currentUser} openTicket={openTicket} />}
          {page === 'pigura'    && <AntrianPigura store={store} update={update} currentUser={currentUser} openTicket={openTicket} />}
          {page === 'bot'       && <BotSimulator store={store} update={update} currentUser={currentUser} openTicket={openTicket} />}
          {page === 'pengaturan'&& <Pengaturan store={store} currentUser={currentUser} />}
        </main>
      </div>

      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
    </div>
  );
}

// ========== USER SWITCHER ==========
function UserSwitcher({ currentUserId, setUser }) {
  const [open, setOpen] = useState(false);
  const cu = USERS.find(u => u.id === currentUserId);
  const grouped = {
    'Office (Dashboard Penuh)':   USERS.filter(u => isOffice(u.peran)),
    'PJ Kecamatan (Field Only)':  USERS.filter(u => u.peran === 'pj_kecamatan'),
    'Tim Lapangan (Field Only)':  USERS.filter(u => u.peran === 'pic'),
    'Spesialisasi':               USERS.filter(u => ['lo_dinas','pigura','super_admin'].includes(u.peran)),
  };
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">
        <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold ${cu.color}`}>
          {cu.nama.split(' ').map(s=>s[0]).slice(0,2).join('')}
        </span>
        <div className="text-left hidden sm:block">
          <div className="text-sm font-medium text-slate-800">{cu.nama}</div>
          <div className="text-xs text-slate-500">{cu.label}</div>
        </div>
        <span className="text-slate-400">▾</span>
      </button>
      {open && (
        <div className="absolute right-0 mt-2 w-80 bg-white border border-slate-200 rounded-xl shadow-xl py-2 z-30 max-h-[80vh] overflow-y-auto">
          {Object.entries(grouped).map(([groupName, users]) => (
            <div key={groupName}>
              <div className="px-3 py-1.5 text-xs text-slate-500 uppercase tracking-wide bg-slate-50">{groupName}</div>
              {users.map(u => (
                <button key={u.id} onClick={() => { setUser(u.id); setOpen(false); }}
                  className={`w-full px-3 py-2 flex items-center gap-3 hover:bg-slate-50 ${currentUserId === u.id ? 'bg-rose-50' : ''}`}>
                  <span className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold ${u.color}`}>
                    {u.nama.split(' ').map(s=>s[0]).slice(0,2).join('')}
                  </span>
                  <div className="text-left">
                    <div className="text-sm font-medium text-slate-800">{u.nama}</div>
                    <div className="text-xs text-slate-500">{u.label}</div>
                  </div>
                </button>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ========== DASHBOARD (role-aware) ==========
function Dashboard({ store, currentUser, openTicket }) {
  const tickets = store.tickets;
  const today = new Date();
  const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

  // Field-tier scoping: PJ Kecamatan only sees own kecamatan
  let scoped = tickets;
  let scopeLabel = '';
  if (currentUser.peran === 'pj_kecamatan') {
    scoped = tickets.filter(t => t.kecamatan === currentUser.kecamatan);
    scopeLabel = ` · Kecamatan ${currentUser.kecamatan}`;
  } else if (currentUser.peran === 'pic') {
    scoped = tickets.filter(t => t.kecamatan === currentUser.kecamatan);
    scopeLabel = ` · Area ${currentUser.kecamatan}`;
  } else if (currentUser.peran === 'lo_dinas') {
    scoped = tickets.filter(t => t.status === 'Diteruskan ke Dinas' || (t.timeline||[]).some(a => a.user === 'joko'));
    scopeLabel = ' · Tiket OPD';
  }

  const masukBulanIni = scoped.filter(t => new Date(t.tanggal_masuk) >= startOfMonth).length;
  const aktif = scoped.filter(t => !['Selesai','Ditutup'].includes(t.status)).length;
  const selesai = scoped.filter(t => ['Selesai','Ditutup'].includes(t.status)).length;
  const lewatSLA = scoped.filter(t => !['Selesai','Ditutup'].includes(t.status) && new Date(t.sla_target) < today).length;

  // Sosmed/Pigura metrics — only for office tier
  const sosmedPosted = scoped.filter(t => t.sosmed && t.sosmed.status === 'posted').length;
  const sosmedAntri  = scoped.filter(t => t.sosmed && ['draft','review'].includes(t.sosmed.status)).length;
  const piguraTotal  = scoped.filter(t => t.flag_pigura).length;
  const piguraSerah  = scoped.filter(t => t.pigura && t.pigura.status === 'diserahkan').length;

  const byKategori = KATEGORI.map(k => ({
    nama: k.nama, count: scoped.filter(t => t.kategori === k.id).length
  })).filter(x => x.count > 0).sort((a,b) => b.count - a.count);

  const byKecamatan = KECAMATAN.map(k => ({
    nama: k, count: scoped.filter(t => t.kecamatan === k).length,
    selesai: scoped.filter(t => t.kecamatan === k && ['Selesai','Ditutup'].includes(t.status)).length,
  }));

  const recent = [...scoped].sort((a,b) => new Date(b.tanggal_masuk) - new Date(a.tanggal_masuk)).slice(0,6);

  const refKat = useRef(null), refKec = useRef(null), refStat = useRef(null);
  useEffect(() => {
    const charts = [];
    if (refKat.current) {
      charts.push(new Chart(refKat.current, {
        type:'bar',
        data:{ labels: byKategori.map(x=>x.nama.replace('Infrastruktur · ','').replace('Lingkungan · ','').replace('Kesehatan · ','').replace('Pendidikan · ','').replace('Adminduk · ','').replace('Sosial · ','')),
               datasets:[{ data: byKategori.map(x=>x.count), backgroundColor:'#dc2626', borderRadius:6 }] },
        options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false, indexAxis:'y' },
      }));
    }
    if (refKec.current && currentUser.peran !== 'pic' && currentUser.peran !== 'pj_kecamatan') {
      charts.push(new Chart(refKec.current, {
        type:'bar',
        data:{ labels: byKecamatan.map(x=>x.nama),
               datasets:[
                 { label:'Aktif', data: byKecamatan.map(x=>x.count - x.selesai), backgroundColor:'#fb923c' },
                 { label:'Selesai', data: byKecamatan.map(x=>x.selesai), backgroundColor:'#10b981' },
               ] },
        options:{ plugins:{legend:{position:'bottom'}}, responsive:true, maintainAspectRatio:false, scales:{x:{stacked:true}, y:{stacked:true}} },
      }));
    }
    if (refStat.current) {
      const stats = STATUS.map(s => scoped.filter(t => t.status === s).length);
      charts.push(new Chart(refStat.current, {
        type:'doughnut',
        data:{ labels: STATUS, datasets:[{ data: stats, backgroundColor:['#94a3b8','#3b82f6','#f59e0b','#fb923c','#10b981','#475569'] }] },
        options:{ plugins:{legend:{position:'bottom'}}, responsive:true, maintainAspectRatio:false },
      }));
    }
    return () => charts.forEach(c => c.destroy());
  }, [tickets, currentUser.peran]);

  const showSosmedKPI = canSeeSosmed(currentUser.peran);
  const showPiguraKPI = canSeePigura(currentUser.peran);

  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl font-bold text-slate-800">Dashboard{scopeLabel}</h1>
        <p className="text-slate-600 text-sm">
          {isOffice(currentUser.peran) ? 'Ringkasan keseluruhan operasional · ' : 'Data laporan lapangan · '}
          {fmtTanggal(today)}
        </p>
        {!canSeeSosmed(currentUser.peran) && (
          <div className="mt-2 text-xs px-3 py-2 bg-slate-100 text-slate-600 rounded-lg inline-block">
            ℹ️ Anda berada di tier <strong>Field</strong> — dashboard hanya menampilkan data operasional lapangan. Modul Media Sosial dan Pigura tidak tersedia.
          </div>
        )}
      </div>

      <div className={`grid grid-cols-2 ${showSosmedKPI ? 'md:grid-cols-6' : 'md:grid-cols-4'} gap-3`}>
        <Kpi label="Masuk Bulan Ini" value={masukBulanIni} accent="rose" sub="aduan baru" />
        <Kpi label="Sedang Ditangani" value={aktif} accent="amber" sub="dalam progres" />
        <Kpi label="Sudah Selesai" value={selesai} accent="emerald" sub="semua waktu" />
        <Kpi label="Lewat SLA" value={lewatSLA} accent="rose" sub="perlu perhatian" />
        {showSosmedKPI && <Kpi label="Konten Posted" value={sosmedPosted} accent="pink" sub={`${sosmedAntri} antri`} />}
        {showPiguraKPI && <Kpi label="Pigura Selesai" value={piguraSerah} accent="violet" sub={`${piguraTotal} total`} />}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <h3 className="font-semibold mb-2 text-slate-800">Distribusi Status</h3>
          <div style={{height:240}}><canvas ref={refStat}></canvas></div>
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <h3 className="font-semibold mb-2 text-slate-800">Per Kategori</h3>
          <div style={{height:240}}><canvas ref={refKat}></canvas></div>
        </div>
        {currentUser.peran !== 'pic' && currentUser.peran !== 'pj_kecamatan' && (
          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold mb-2 text-slate-800">Sebaran Kecamatan</h3>
            <div style={{height:240}}><canvas ref={refKec}></canvas></div>
          </div>
        )}
      </div>

      <div className="bg-white rounded-xl border border-slate-200">
        <div className="p-4 border-b border-slate-200 flex items-center justify-between">
          <h3 className="font-semibold text-slate-800">Aduan Terbaru{scopeLabel}</h3>
          <span className="text-xs text-slate-500">{recent.length} dari {scoped.length} tiket</span>
        </div>
        <div className="divide-y divide-slate-100">
          {recent.map(t => (
            <button key={t.id} onClick={() => openTicket(t.id)} className="w-full text-left p-3 hover:bg-slate-50 flex items-center gap-3">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-mono text-slate-500">{t.nomor}</span>
                  <span className={`pill ${STATUS_COLORS[t.status]}`}>{t.status}</span>
                  <span className={`pill ${PRIORITAS_COLORS[t.prioritas]}`}>{t.prioritas}</span>
                </div>
                <div className="font-medium text-slate-800 truncate">{t.judul}</div>
                <div className="text-xs text-slate-500">{t.kecamatan} · {t.kelurahan} · {fmtTanggal(t.tanggal_masuk)}</div>
              </div>
              <div className="text-slate-400">›</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function Kpi({ label, value, sub, accent }) {
  const colorMap = {
    rose:'border-rose-200 bg-rose-50 text-rose-700',
    amber:'border-amber-200 bg-amber-50 text-amber-700',
    emerald:'border-emerald-200 bg-emerald-50 text-emerald-700',
    sky:'border-sky-200 bg-sky-50 text-sky-700',
    pink:'border-pink-200 bg-pink-50 text-pink-700',
    violet:'border-violet-200 bg-violet-50 text-violet-700',
  };
  return (
    <div className={`rounded-xl border p-4 ${colorMap[accent]}`}>
      <div className="text-xs uppercase tracking-wide opacity-80">{label}</div>
      <div className="text-3xl font-bold mt-1">{value}</div>
      <div className="text-xs opacity-70 mt-1">{sub}</div>
    </div>
  );
}

// ========== DAFTAR ADUAN ==========
function DaftarAduan({ store, currentUser, openTicket }) {
  const defaultKec = (currentUser.peran === 'pic' || currentUser.peran === 'pj_kecamatan') ? currentUser.kecamatan : '';
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [filterKategori, setFilterKategori] = useState('');
  const [filterKec, setFilterKec] = useState(defaultKec);

  const filtered = store.tickets.filter(t => {
    if (search && !`${t.judul} ${t.deskripsi} ${t.nomor} ${t.pelapor.nama}`.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterStatus && t.status !== filterStatus) return false;
    if (filterKategori && t.kategori !== filterKategori) return false;
    if (filterKec && t.kecamatan !== filterKec) return false;
    return true;
  }).sort((a,b) => new Date(b.tanggal_masuk) - new Date(a.tanggal_masuk));

  const lockKecamatan = (currentUser.peran === 'pic' || currentUser.peran === 'pj_kecamatan');

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl font-bold text-slate-800">Daftar Aduan</h1>
        <span className="text-sm text-slate-500">{filtered.length} dari {store.tickets.length} tiket</span>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-3 grid grid-cols-1 md:grid-cols-4 gap-3">
        <input type="text" placeholder="Cari nomor / judul / pelapor..." value={search} onChange={e=>setSearch(e.target.value)}
          className="md:col-span-2 px-3 py-2 border border-slate-200 rounded-lg text-sm" />
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-sm">
          <option value="">Semua Status</option>
          {STATUS.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={filterKec} onChange={e=>setFilterKec(e.target.value)} disabled={lockKecamatan} title={lockKecamatan ? `Anda hanya melihat ${currentUser.kecamatan}` : ''} className="px-3 py-2 border border-slate-200 rounded-lg text-sm disabled:bg-slate-100">
          <option value="">Semua Kecamatan</option>
          {KECAMATAN.map(k => <option key={k} value={k}>{k}</option>)}
        </select>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div className="hidden md:grid grid-cols-12 gap-2 px-4 py-2 text-xs uppercase font-semibold text-slate-500 bg-slate-50 border-b border-slate-200">
          <div className="col-span-2">Nomor</div>
          <div className="col-span-4">Judul</div>
          <div className="col-span-2">Lokasi</div>
          <div className="col-span-2">Status</div>
          <div className="col-span-2">Tanggal</div>
        </div>
        <div className="divide-y divide-slate-100">
          {filtered.length === 0 && <div className="p-8 text-center text-slate-500">Tidak ada tiket yang cocok dengan filter.</div>}
          {filtered.map(t => {
            const overSla = !['Selesai','Ditutup'].includes(t.status) && new Date(t.sla_target) < new Date();
            return (
              <button key={t.id} onClick={() => openTicket(t.id)} className="w-full text-left grid grid-cols-1 md:grid-cols-12 gap-2 px-4 py-3 hover:bg-slate-50 items-center">
                <div className="md:col-span-2 text-xs font-mono text-slate-500">{t.nomor}</div>
                <div className="md:col-span-4">
                  <div className="font-medium text-slate-800">{t.judul}</div>
                  <div className="text-xs text-slate-500">{t.pelapor.nama} · {t.kanal}</div>
                </div>
                <div className="md:col-span-2 text-sm text-slate-600">{t.kecamatan}<br/><span className="text-xs text-slate-500">{t.kelurahan}</span></div>
                <div className="md:col-span-2 flex flex-wrap gap-1">
                  <span className={`pill ${STATUS_COLORS[t.status]}`}>{t.status}</span>
                  {overSla && <span className="pill bg-rose-600 text-white">Lewat SLA</span>}
                </div>
                <div className="md:col-span-2 text-xs text-slate-500">{fmtTanggal(t.tanggal_masuk)}</div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ========== TUGAS SAYA ==========
function TugasSaya({ store, currentUser, openTicket }) {
  const tickets = store.tickets.filter(t => {
    if (currentUser.peran === 'pic') return t.assignee === currentUser.id || (t.kecamatan === currentUser.kecamatan && !['Selesai','Ditutup'].includes(t.status));
    if (currentUser.peran === 'pj_kecamatan') return t.kecamatan === currentUser.kecamatan && !['Selesai','Ditutup'].includes(t.status);
    if (currentUser.peran === 'koordinator' || currentUser.peran === 'admin_kantor') return ['Baru','Triase'].includes(t.status);
    if (currentUser.peran === 'lo_dinas') return t.status === 'Diteruskan ke Dinas';
    return false;
  });
  const desc = {
    pic: `Tiket aktif di area ${currentUser.kecamatan}`,
    pj_kecamatan: `Tiket aktif di Kecamatan ${currentUser.kecamatan} yang Anda awasi`,
    koordinator: 'Tiket yang menunggu triase atau penugasan',
    admin_kantor: 'Tiket yang menunggu triase atau penugasan',
    lo_dinas: 'Tiket yang sudah diteruskan ke OPD untuk follow-up',
  };
  return (
    <div className="space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-800">Tugas Saya</h1>
        <p className="text-slate-600 text-sm">{desc[currentUser.peran]}</p>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
        {tickets.length === 0 && <div className="p-8 text-center text-slate-500">Tidak ada tugas aktif saat ini. 🎉</div>}
        {tickets.map(t => (
          <button key={t.id} onClick={() => openTicket(t.id)} className="w-full text-left p-4 hover:bg-slate-50 flex items-center gap-3">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-1 flex-wrap">
                <span className="text-xs font-mono text-slate-500">{t.nomor}</span>
                <span className={`pill ${STATUS_COLORS[t.status]}`}>{t.status}</span>
                <span className={`pill ${PRIORITAS_COLORS[t.prioritas]}`}>{t.prioritas}</span>
                {t.assignee && <span className="pill bg-slate-100 text-slate-600">→ {USERS.find(u=>u.id===t.assignee)?.nama}</span>}
              </div>
              <div className="font-medium text-slate-800">{t.judul}</div>
              <div className="text-xs text-slate-500">{t.kecamatan} · {t.kelurahan} · {fmtTanggal(t.tanggal_masuk)}</div>
            </div>
            <div className="text-slate-400">›</div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ========== FORM TIKET BARU ==========
function FormBaru({ store, update, currentUser, onCreated }) {
  const [form, setForm] = useState({
    judul:'', deskripsi:'', kategori:'inf_jalan',
    kecamatan: currentUser.kecamatan || 'Kebon Jeruk',
    kelurahan:'',
    alamat:'', pelaporNama:'', pelaporHp:'',
    kanal: currentUser.peran === 'pic' ? 'PIC' : 'WA',
    prioritas:'Sedang',
  });
  const set = (k,v) => setForm(f => ({...f, [k]:v}));
  const kelOptions = KELURAHAN_BY_KEC[form.kecamatan] || [];

  const submit = (e) => {
    e.preventDefault();
    if (!form.judul || !form.deskripsi || !form.pelaporNama) {
      alert('Mohon lengkapi: Judul, Deskripsi, dan Nama Pelapor.');
      return;
    }
    update(s => {
      const counter = s.counter;
      const now = new Date();
      const kat = KATEGORI.find(k=>k.id===form.kategori);
      const slaTarget = new Date(now); slaTarget.setDate(now.getDate()+kat.sla);
      const t = {
        id: `t${counter.toString().padStart(4,'0')}`,
        nomor: `LI-2026-${counter.toString().padStart(4,'0')}`,
        judul: form.judul, deskripsi: form.deskripsi,
        kategori: form.kategori,
        kecamatan: form.kecamatan, kelurahan: form.kelurahan || kelOptions[0],
        alamat: form.alamat,
        pelapor: { nama: form.pelaporNama, hp: form.pelaporHp },
        kanal: form.kanal, status:'Baru', prioritas: form.prioritas,
        flag_pigura:false, koordinat: null,
        tanggal_masuk: now.toISOString(),
        sla_target: slaTarget.toISOString(),
        tanggal_selesai:null, assignee:null, pencatat: currentUser.id,
        timeline: [{ id:`a-${counter}-1`, tipe:'create', user:currentUser.id, desc:`Aduan dicatat dari kanal ${form.kanal}`, ts: now.toISOString() }],
        poinList: [], sosmed:null, pigura:null, lampiran: [],
      };
      s.tickets.unshift(t);
      s.counter += 1;
      setTimeout(() => onCreated(t.id), 100);
    });
  };

  return (
    <div className="max-w-2xl space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-800">Tiket Aduan Baru</h1>
        <p className="text-slate-600 text-sm">Catat aduan ke sistem. Nomor tiket dihasilkan otomatis (LI-2026-XXXX).</p>
      </div>

      <form onSubmit={submit} className="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Judul Aduan *">
            <input type="text" value={form.judul} onChange={e=>set('judul',e.target.value)} placeholder="Mis. Lampu PJU mati di RT 04"
              className="w-full px-3 py-2 border border-slate-200 rounded-lg" />
          </Field>
          <Field label="Kanal Aduan">
            <select value={form.kanal} onChange={e=>set('kanal',e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg">
              <option value="WA">WhatsApp 0811-8055-155</option>
              <option value="PIC">Langsung ke PIC di lapangan</option>
              <option value="Reses">Reses / Pertemuan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </Field>
        </div>

        <Field label="Deskripsi *">
          <textarea rows={3} value={form.deskripsi} onChange={e=>set('deskripsi',e.target.value)} placeholder="Jelaskan kondisi aduan..."
            className="w-full px-3 py-2 border border-slate-200 rounded-lg" />
        </Field>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label="Kategori">
            <select value={form.kategori} onChange={e=>set('kategori',e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg">
              {KATEGORI.map(k => <option key={k.id} value={k.id}>{k.nama}</option>)}
            </select>
          </Field>
          <Field label="Prioritas">
            <select value={form.prioritas} onChange={e=>set('prioritas',e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg">
              {PRIORITAS.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </Field>
          <Field label="SLA Target">
            <div className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700">
              {KATEGORI.find(k=>k.id===form.kategori)?.sla} hari kerja
            </div>
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Kecamatan">
            <select value={form.kecamatan} onChange={e=>{set('kecamatan',e.target.value); set('kelurahan','');}} className="w-full px-3 py-2 border border-slate-200 rounded-lg">
              {KECAMATAN.map(k => <option key={k} value={k}>{k}</option>)}
            </select>
          </Field>
          <Field label="Kelurahan">
            <select value={form.kelurahan} onChange={e=>set('kelurahan',e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg">
              <option value="">Pilih kelurahan...</option>
              {kelOptions.map(k => <option key={k} value={k}>{k}</option>)}
            </select>
          </Field>
        </div>

        <Field label="Alamat Detail">
          <input type="text" value={form.alamat} onChange={e=>set('alamat',e.target.value)} placeholder="RT/RW, jalan, patokan..."
            className="w-full px-3 py-2 border border-slate-200 rounded-lg" />
        </Field>

        <div className="border-t pt-4">
          <h3 className="font-semibold text-slate-800 mb-2">Data Pelapor</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <Field label="Nama Pelapor *">
              <input type="text" value={form.pelaporNama} onChange={e=>set('pelaporNama',e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-lg" />
            </Field>
            <Field label="No. HP / WhatsApp">
              <input type="text" value={form.pelaporHp} onChange={e=>set('pelaporHp',e.target.value)} placeholder="0812..."
                className="w-full px-3 py-2 border border-slate-200 rounded-lg" />
            </Field>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-2">
          <button type="submit" className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-medium">
            Catat Aduan & Generate Tiket
          </button>
        </div>
      </form>
    </div>
  );
}

function Field({label, children}) {
  return <label className="block">
    <span className="text-xs font-medium text-slate-700 mb-1 block">{label}</span>
    {children}
  </label>;
}

// ========== DETAIL TIKET ==========
function DetailTiket({ store, update, ticketId, currentUser, goBack }) {
  const t = store.tickets.find(x => x.id === ticketId);
  if (!t) return <div>Tiket tidak ditemukan. <button onClick={goBack} className="text-rose-600 underline">Kembali</button></div>;
  const kat = KATEGORI.find(k => k.id === t.kategori);
  const overSla = !['Selesai','Ditutup'].includes(t.status) && new Date(t.sla_target) < new Date();

  const updateStatus = (newStatus, desc) => {
    update(s => {
      const tt = s.tickets.find(x => x.id === ticketId);
      tt.status = newStatus;
      tt.timeline.push({ id:`a-${Date.now()}`, tipe:'status_change', user:currentUser.id, desc:`${newStatus} — ${desc||''}`, ts:new Date().toISOString(), status:newStatus });
      if (newStatus === 'Selesai') tt.tanggal_selesai = new Date().toISOString();
    });
  };

  const assignTo = (userId) => {
    update(s => {
      const tt = s.tickets.find(x => x.id === ticketId);
      tt.assignee = userId;
      const u = USERS.find(u => u.id === userId);
      tt.timeline.push({ id:`a-${Date.now()}`, tipe:'assign', user:currentUser.id, desc:`Di-assign ke ${u.nama}`, ts:new Date().toISOString() });
      if (tt.status === 'Baru') tt.status = 'Triase';
    });
  };

  const checkIn = () => {
    const finalize = (lat, lng) => {
      update(s => {
        const tt = s.tickets.find(x => x.id === ticketId);
        tt.koordinat = { lat, lng };
        tt.timeline.push({ id:`a-${Date.now()}`, tipe:'checkin', user:currentUser.id, desc:`Check-in GPS di lokasi (${lat.toFixed(5)}, ${lng.toFixed(5)})`, ts:new Date().toISOString() });
        if (tt.status === 'Triase' || tt.status === 'Baru') tt.status = 'Verifikasi Lapangan';
        tt.poinList.push({ user: currentUser.id, kode:'verifikasi', poin: Math.round(5 * kat.multiplier), ts: new Date().toISOString(), status:'pending' });
      });
      alert('Check-in GPS berhasil & 5 poin tercatat (status pending — menunggu approval Koordinator/PJ).');
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => finalize(pos.coords.latitude, pos.coords.longitude),
        () => finalize(-6.17 + Math.random()*0.05, 106.78 + Math.random()*0.06)
      );
    } else {
      finalize(-6.17 + Math.random()*0.05, 106.78 + Math.random()*0.06);
    }
  };

  const onUploadFoto = (e, jenis) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      update(s => {
        const tt = s.tickets.find(x => x.id === ticketId);
        tt.lampiran.push({ id:`l-${Date.now()}`, jenis, nama:file.name, dataUrl:reader.result, uploadedBy:currentUser.id, ts:new Date().toISOString() });
        tt.timeline.push({ id:`a-${Date.now()}`, tipe:'lampiran', user:currentUser.id, desc:`Foto ${jenis} diunggah: ${file.name}`, ts:new Date().toISOString() });
      });
    };
    reader.readAsDataURL(file);
  };

  const tutupTiket = () => {
    update(s => {
      const tt = s.tickets.find(x => x.id === ticketId);
      tt.status = 'Ditutup';
      tt.timeline.push({ id:`a-${Date.now()}`, tipe:'status_change', user:currentUser.id, desc:'Tiket ditutup, pelapor sudah dinotifikasi', ts:new Date().toISOString() });
    });
    alert('Tiket ditutup. Notifikasi (simulasi) terkirim ke pelapor.');
  };

  const tandaiPigura = () => {
    update(s => {
      const tt = s.tickets.find(x => x.id === ticketId);
      tt.flag_pigura = !tt.flag_pigura;
      if (tt.flag_pigura && !tt.pigura) {
        tt.pigura = { status:'disetujui', vendor:'', biaya:0, tanggal_pesan:null, tanggal_terima_vendor:null, tanggal_serah:null };
      }
      tt.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:currentUser.id, desc: tt.flag_pigura ? 'Ditandai untuk dibuatkan pigura' : 'Tanda pigura dibatalkan', ts:new Date().toISOString() });
    });
  };

  const eskalasiSosmed = () => {
    update(s => {
      const tt = s.tickets.find(x => x.id === ticketId);
      if (!tt.sosmed) {
        tt.sosmed = { status:'draft', platform:[], caption:'', link:null, ts:new Date().toISOString() };
        tt.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:currentUser.id, desc:'Masuk antrian dokumentasi sosmed', ts:new Date().toISOString() });
      }
    });
  };

  const canEdit = ['koordinator','pic','pj_kecamatan','admin_kantor','lo_dinas','super_admin'].includes(currentUser.peran);
  const canApprove = canApprovePoin(currentUser.peran);
  const totalPoin = t.poinList.reduce((a,p) => a + p.poin, 0);
  const sosmedVisible = canSeeSosmed(currentUser.peran);

  return (
    <div className="space-y-4">
      <div>
        <button onClick={goBack} className="text-rose-600 hover:underline text-sm mb-2">← Kembali ke Daftar</button>
        <div className="flex flex-wrap items-start justify-between gap-3">
          <div>
            <div className="flex items-center gap-2 mb-1 flex-wrap">
              <span className="text-sm font-mono text-slate-500">{t.nomor}</span>
              <span className={`pill ${STATUS_COLORS[t.status]}`}>{t.status}</span>
              <span className={`pill ${PRIORITAS_COLORS[t.prioritas]}`}>{t.prioritas}</span>
              {overSla && <span className="pill bg-rose-600 text-white">Lewat SLA</span>}
              {t.flag_pigura && <span className="pill bg-violet-100 text-violet-700">🖼️ Pigura</span>}
            </div>
            <h1 className="text-2xl font-bold text-slate-800">{t.judul}</h1>
            <div className="text-sm text-slate-600">{kat.nama} · {t.kecamatan} · {t.kelurahan}</div>
          </div>
          <div className="flex flex-wrap gap-2">
            {canEdit && t.status === 'Baru' && ['koordinator','admin_kantor','pj_kecamatan'].includes(currentUser.peran) && (
              <select onChange={e => assignTo(e.target.value)} value="" className="px-3 py-1.5 border border-slate-200 rounded-lg text-sm">
                <option value="" disabled>Tugaskan ke PIC...</option>
                {USERS.filter(u => u.peran === 'pic').map(u => <option key={u.id} value={u.id}>{u.nama} ({u.kecamatan})</option>)}
              </select>
            )}
            {canEdit && t.status === 'Verifikasi Lapangan' && (
              <>
                <button onClick={() => updateStatus('Selesai', 'Diselesaikan oleh tim internal')} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm">✓ Selesai Internal</button>
                <button onClick={() => updateStatus('Diteruskan ke Dinas', 'Surat ke OPD diteruskan')} className="px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-sm">→ Eskalasi Dinas</button>
              </>
            )}
            {canEdit && t.status === 'Diteruskan ke Dinas' && (
              <button onClick={() => updateStatus('Selesai', 'Dinas sudah menindaklanjuti')} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm">✓ Dinas Selesai</button>
            )}
            {t.status === 'Selesai' && canEdit && (
              <button onClick={tutupTiket} className="px-3 py-1.5 bg-slate-600 hover:bg-slate-700 text-white rounded-lg text-sm">Tutup Tiket</button>
            )}
            {(currentUser.peran === 'pic' || currentUser.peran === 'pj_kecamatan') && ['Triase','Verifikasi Lapangan','Baru'].includes(t.status) && (
              <button onClick={checkIn} className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm">📍 Check-in GPS</button>
            )}
            {['koordinator','admin_kantor','owner'].includes(currentUser.peran) && (
              <button onClick={tandaiPigura} className={`px-3 py-1.5 ${t.flag_pigura?'bg-violet-100 text-violet-700':'bg-violet-600 hover:bg-violet-700 text-white'} rounded-lg text-sm`}>
                🖼️ {t.flag_pigura ? 'Pigura: Ya' : 'Tandai Pigura'}
              </button>
            )}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold text-slate-800 mb-2">Deskripsi Aduan</h3>
            <p className="text-slate-700 text-sm">{t.deskripsi}</p>
            <div className="mt-3 grid grid-cols-2 gap-3 text-sm">
              <div><span className="text-slate-500 text-xs">Pelapor</span><div className="font-medium">{t.pelapor.nama}</div><div className="text-xs text-slate-500">{t.pelapor.hp}</div></div>
              <div><span className="text-slate-500 text-xs">Alamat</span><div className="font-medium">{t.alamat || '—'}</div></div>
              <div><span className="text-slate-500 text-xs">Kanal</span><div className="font-medium">{t.kanal}</div></div>
              <div><span className="text-slate-500 text-xs">Tanggal Masuk</span><div className="font-medium">{fmtTanggal(t.tanggal_masuk)}</div></div>
              <div><span className="text-slate-500 text-xs">SLA Target</span><div className="font-medium">{fmtTanggal(t.sla_target)}</div></div>
              <div><span className="text-slate-500 text-xs">Assignee</span><div className="font-medium">{t.assignee ? USERS.find(u=>u.id===t.assignee)?.nama : '—'}</div></div>
            </div>
            {t.koordinat && (
              <div className="mt-3 p-2 bg-slate-50 rounded-lg text-xs flex items-center gap-2">
                <span>📍</span>
                <a href={`https://maps.google.com/?q=${t.koordinat.lat},${t.koordinat.lng}`} target="_blank" rel="noreferrer" className="text-rose-600 hover:underline">
                  {t.koordinat.lat.toFixed(5)}, {t.koordinat.lng.toFixed(5)}
                </a>
              </div>
            )}
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-semibold text-slate-800">Foto & Lampiran</h3>
              {canEdit && (
                <div className="flex gap-2 text-xs">
                  <label className="cursor-pointer px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded">
                    📷 Foto Before
                    <input type="file" accept="image/*" capture="environment" onChange={(e)=>onUploadFoto(e,'before')} className="hidden" />
                  </label>
                  <label className="cursor-pointer px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded">
                    📷 Foto After
                    <input type="file" accept="image/*" capture="environment" onChange={(e)=>onUploadFoto(e,'after')} className="hidden" />
                  </label>
                </div>
              )}
            </div>
            {t.lampiran.length === 0 ? (
              <div className="text-sm text-slate-500 italic">Belum ada foto. Klik tombol di atas untuk upload.</div>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                {t.lampiran.map(l => (
                  <div key={l.id} className="border border-slate-200 rounded-lg overflow-hidden">
                    <img src={l.dataUrl} alt={l.jenis} className="w-full h-32 object-cover" />
                    <div className="p-1.5 text-xs flex items-center justify-between bg-slate-50">
                      <span className="capitalize font-medium">{l.jenis}</span>
                      <span className="text-slate-500">{fmtTanggal(l.ts)}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold text-slate-800 mb-3">Riwayat Aksi</h3>
            <ol className="space-y-3 border-l-2 border-slate-200 pl-4">
              {t.timeline.slice().reverse().map(a => {
                const u = USERS.find(x => x.id === a.user);
                return (
                  <li key={a.id} className="relative">
                    <span className="absolute -left-[22px] top-1 w-3 h-3 bg-rose-500 rounded-full ring-2 ring-white"></span>
                    <div className="text-sm text-slate-800">{a.desc}</div>
                    <div className="text-xs text-slate-500">{u?.nama || a.user} · {fmtTanggalJam(a.ts)}</div>
                  </li>
                );
              })}
            </ol>
          </div>
        </div>

        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold text-slate-800 mb-2 flex items-center gap-2">⭐ Poin Tiket</h3>
            <div className="text-3xl font-bold text-rose-600">{totalPoin}</div>
            <div className="text-xs text-slate-500 mb-3">total poin terhitung</div>
            {t.poinList.length === 0 ? (
              <div className="text-xs text-slate-500 italic">Belum ada poin tercatat.</div>
            ) : (
              <div className="space-y-1.5">
                {t.poinList.map((p, i) => {
                  const aturan = ATURAN_POIN.find(a => a.kode === p.kode);
                  const u = USERS.find(x => x.id === p.user);
                  return (
                    <div key={i} className="flex items-center justify-between p-2 bg-slate-50 rounded text-xs">
                      <div>
                        <div className="font-medium">{aturan?.label}</div>
                        <div className="text-slate-500">{u?.nama} · {p.status}</div>
                      </div>
                      <div className={`font-bold ${p.status==='approved'?'text-emerald-600':'text-amber-600'}`}>+{p.poin}</div>
                    </div>
                  );
                })}
              </div>
            )}
            {canApprove && t.poinList.some(p => p.status === 'pending') && (
              <button onClick={() => update(s => {
                const tt = s.tickets.find(x => x.id === ticketId);
                tt.poinList.forEach(p => { if (p.status === 'pending') p.status = 'approved'; });
                tt.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:currentUser.id, desc:'Approve seluruh poin pending tiket ini', ts:new Date().toISOString() });
              })} className="mt-3 w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-sm">Approve semua poin pending</button>
            )}
          </div>

          {sosmedVisible && (t.status === 'Selesai' || t.status === 'Ditutup' || t.sosmed) && (
            <div className="bg-white rounded-xl border border-slate-200 p-4">
              <h3 className="font-semibold text-slate-800 mb-2 flex items-center gap-2">📱 Dokumentasi Sosmed</h3>
              {!t.sosmed ? (
                ['koordinator','sosmed','admin_kantor','owner'].includes(currentUser.peran) ? (
                  <button onClick={eskalasiSosmed} className="w-full py-1.5 bg-pink-600 hover:bg-pink-700 text-white rounded text-sm">Tambahkan ke Antrian Sosmed</button>
                ) : (
                  <div className="text-xs text-slate-500 italic">Belum masuk antrian sosmed.</div>
                )
              ) : (

// ========== POIN SAYA ==========
function PoinSaya({ store, update, currentUser }) {
  const allPoin = [];
  store.tickets.forEach(t => {
    t.poinList.forEach(p => allPoin.push({ ...p, ticketId: t.id, ticketNomor: t.nomor, ticketJudul: t.judul, ticketKecamatan: t.kecamatan }));
  });

  const isLeaderView = ['owner','koordinator','admin_kantor','super_admin'].includes(currentUser.peran);
  const isPJView = currentUser.peran === 'pj_kecamatan';

  let filteredPoin = allPoin;
  let scopeLabel = 'Anda';
  if (isLeaderView) { scopeLabel = 'Seluruh tim'; }
  else if (isPJView) { filteredPoin = allPoin.filter(p => p.ticketKecamatan === currentUser.kecamatan); scopeLabel = `Tim Kecamatan ${currentUser.kecamatan}`; }
  else { filteredPoin = allPoin.filter(p => p.user === currentUser.id); }

  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthlyByUser = {};
  filteredPoin.filter(p => new Date(p.ts) >= startOfMonth).forEach(p => {
    if (!monthlyByUser[p.user]) monthlyByUser[p.user] = { total:0, approved:0, pending:0, count:0 };
    monthlyByUser[p.user].total += p.poin;
    monthlyByUser[p.user][p.status] = (monthlyByUser[p.user][p.status]||0) + p.poin;
    monthlyByUser[p.user].count += 1;
  });
  const RUPIAH_PER_POIN = 7000;

  return (
    <div className="space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-800">Poin & Insentif</h1>
        <p className="text-slate-600 text-sm">{scopeLabel} · Bulan {now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})} · 1 poin = Rp {RUPIAH_PER_POIN.toLocaleString('id-ID')}</p>
      </div>

      {!isLeaderView && !isPJView && (
        <div className="bg-gradient-to-br from-rose-500 to-rose-700 text-white rounded-xl p-5">
          <div className="text-sm opacity-90">Total Poin Bulan Ini</div>
          <div className="text-5xl font-bold mt-1">{monthlyByUser[currentUser.id]?.total || 0}</div>
          <div className="text-sm opacity-90 mt-2">≈ Rp {((monthlyByUser[currentUser.id]?.total || 0) * RUPIAH_PER_POIN).toLocaleString('id-ID')}</div>
          <div className="mt-3 grid grid-cols-2 gap-3 text-xs">
            <div className="bg-white/10 rounded p-2"><div className="opacity-80">Approved</div><div className="text-lg font-bold">{monthlyByUser[currentUser.id]?.approved || 0}</div></div>
            <div className="bg-white/10 rounded p-2"><div className="opacity-80">Pending</div><div className="text-lg font-bold">{monthlyByUser[currentUser.id]?.pending || 0}</div></div>
          </div>
        </div>
      )}

      {(isLeaderView || isPJView) && (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="p-4 border-b border-slate-200 flex items-center justify-between">
            <h3 className="font-semibold">Leaderboard Bulan Ini</h3>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50">
                <tr><th className="text-left px-4 py-2">#</th><th className="text-left px-4 py-2">Nama</th><th className="text-right px-4 py-2">Tiket</th><th className="text-right px-4 py-2">Approved</th><th className="text-right px-4 py-2">Pending</th><th className="text-right px-4 py-2">Total</th><th className="text-right px-4 py-2">Insentif</th></tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {Object.entries(monthlyByUser).map(([uid, m]) => USERS.find(u=>u.id===uid) && [uid, m]).filter(Boolean).sort((a,b) => b[1].total - a[1].total).map(([uid, m], i) => {
                  const u = USERS.find(u => u.id === uid);
                  return (
                    <tr key={uid}>
                      <td className="px-4 py-2 text-slate-500">{i+1}</td>
                      <td className="px-4 py-2"><div className="font-medium">{u.nama}</div><div className="text-xs text-slate-500">{u.label}</div></td>
                      <td className="px-4 py-2 text-right">{m.count}</td>
                      <td className="px-4 py-2 text-right text-emerald-600">{m.approved||0}</td>
                      <td className="px-4 py-2 text-right text-amber-600">{m.pending||0}</td>
                      <td className="px-4 py-2 text-right font-bold">{m.total}</td>
                      <td className="px-4 py-2 text-right">Rp {(m.total * RUPIAH_PER_POIN).toLocaleString('id-ID')}</td>
                    </tr>
                  );
                })}
                {Object.keys(monthlyByUser).length === 0 && <tr><td colSpan={7} className="px-4 py-8 text-center text-slate-500">Belum ada poin tercatat bulan ini.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="bg-white rounded-xl border border-slate-200">
        <div className="p-4 border-b border-slate-200">
          <h3 className="font-semibold">Riwayat Poin</h3>
        </div>
        <div className="divide-y divide-slate-100">
          {filteredPoin.length === 0 && <div className="p-8 text-center text-slate-500">Belum ada riwayat poin.</div>}
          {filteredPoin.slice().sort((a,b) => new Date(b.ts) - new Date(a.ts)).slice(0,40).map((p, i) => {
            const aturan = ATURAN_POIN.find(a => a.kode === p.kode);
            const u = USERS.find(x => x.id === p.user);
            return (
              <div key={i} className="px-4 py-2.5 flex items-center justify-between text-sm">
                <div className="flex-1 min-w-0">

                  <div className="text-xs text-slate-500">{p.ticketNomor} · {p.ticketJudul} · {u?.nama}</div>

                <div className="flex items-center gap-2">
                  <span className={`pill ${p.status==='approved'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}`}>{p.status}</span>
                  <span className="font-bold text-rose-600">+{p.poin}</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <h3 className="font-semibold mb-2">Aturan Poin</h3>
        <div className="space-y-1.5 text-sm">
          {ATURAN_POIN.map(a => (
            <div key={a.kode} className="flex items-center justify-between p-2 bg-slate-50 rounded">
              <span>{a.label}</span>
              <span className="font-bold text-rose-600">+{a.poin}</span>
            </div>
          ))}
          <div className="text-xs text-slate-500 mt-2">Multiplier kategori: Banjir 1.5x · Kesehatan 1.2x · lainnya 1.0x</div>
        </div>
      </div>
    </div>
  );
}

function AntrianSosmed({ store, update, currentUser, openTicket }) {
  const queue = store.tickets.filter(t => t.sosmed);
  const draft = queue.filter(t => t.sosmed.status === 'draft');
  const review = queue.filter(t => t.sosmed.status === 'review');
  const posted = queue.filter(t => t.sosmed.status === 'posted');

  const submitDraft = (ticketId, fields) => {
    update(s => {
      const t = s.tickets.find(x => x.id === ticketId);
      Object.assign(t.sosmed, fields, { status:'review' });
      t.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:currentUser.id, desc:'Submit konten sosmed untuk approval', ts:new Date().toISOString() });
    });
  };
  const approve = (ticketId) => {
    update(s => {
      const t = s.tickets.find(x => x.id === ticketId);
      t.sosmed.status = 'posted';
      t.sosmed.approver = currentUser.id;
      t.sosmed.link = t.sosmed.link || `https://instagram.com/p/${Math.random().toString(36).substr(2,9)}`;
      t.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:currentUser.id, desc:'Approve & posting konten sosmed', ts:new Date().toISOString() });
    });
  };

  const Card = ({t, action}) => (
    <div className="bg-white rounded-lg border border-slate-200 p-3 mb-2">
      <div className="flex items-center justify-between mb-1">
        <button onClick={()=>openTicket(t.id)} className="text-xs font-mono text-pink-600 hover:underline">{t.nomor}</button>
        <span className="text-xs text-slate-500">{fmtTanggal(t.tanggal_selesai || t.tanggal_masuk)}</span>
      </div>
      <div className="font-medium text-sm">{t.judul}</div>
      <div className="text-xs text-slate-500 mb-2">{t.kecamatan} · {t.kelurahan}</div>
      {t.sosmed.caption && <div className="text-xs bg-slate-50 p-2 rounded mb-2">{t.sosmed.caption}</div>}
      {t.sosmed.platform?.length > 0 && <div className="flex gap-1 mb-2">{t.sosmed.platform.map(p => <span key={p} className="pill bg-pink-100 text-pink-700">{p}</span>)}</div>}
      {t.sosmed.link && <a href={t.sosmed.link} target="_blank" rel="noreferrer" className="text-xs text-pink-600 hover:underline">Lihat post ↗</a>}
      {action}
    </div>
  );

  return (
    <div className="space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-800">Antrian Media Sosial</h1>
        <p className="text-slate-600 text-sm">Konten dokumentasi pasca-penyelesaian aduan</p>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">

          {draft.length === 0 && <div className="text-xs text-slate-500 italic p-3 bg-white rounded-lg border border-dashed border-slate-200">Tidak ada draft.</div>}
          {draft.map(t => <Card key={t.id} t={t} action={
            currentUser.peran === 'sosmed' && (
              <button onClick={() => {
                const cap = prompt('Tulis caption:', `Aduan dari warga ${t.kelurahan} berhasil ditindaklanjuti. ${t.judul}. #Dapil10Jakbar #LaporIma`);
                if (cap) submitDraft(t.id, { caption: cap, platform:['IG','FB'] });

// ========== ANTRIAN PIGURA ==========
function AntrianPigura({ store, update, currentUser, openTicket }) {
  const queue = store.tickets.filter(t => t.flag_pigura && t.pigura);
  const groups = {
    disetujui:queue.filter(t=>t.pigura.status==='disetujui'),
    dipesan:  queue.filter(t=>t.pigura.status==='dipesan'),
    diterima: queue.filter(t=>t.pigura.status==='diterima'),
    diserahkan:queue.filter(t=>t.pigura.status==='diserahkan'),
  };
  const advance = (id) => {
    update(s => {
      const t = s.tickets.find(x => x.id === id);
      const flow = ['disetujui','dipesan','diterima','diserahkan'];
      const idx = flow.indexOf(t.pigura.status);
      if (idx < flow.length - 1) {
        const next = flow[idx+1];
        t.pigura.status = next;
        if (next === 'dipesan') { t.pigura.tanggal_pesan = new Date().toISOString(); t.pigura.vendor = t.pigura.vendor || 'Pigura Jakbar Mandiri'; t.pigura.biaya = 75000; }
        if (next === 'diterima') t.pigura.tanggal_terima_vendor = new Date().toISOString();
        if (next === 'diserahkan') t.pigura.tanggal_serah = new Date().toISOString();
        t.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:currentUser.id, desc:`Pigura: ${next}`, ts:new Date().toISOString() });
      }
    });
  };
  const Col = ({title, items, badge, actLabel}) => (
    <div>
      <h3 className="font-semibold text-sm mb-2 flex items-center gap-2">{title} <span className={`pill ${badge}`}>{items.length}</span></h3>
      {items.length === 0 && <div className="text-xs text-slate-500 italic p-3 bg-white rounded-lg border border-dashed border-slate-200">Kosong</div>}
      {items.map(t => (
        <div key={t.id} className="bg-white rounded-lg border border-slate-200 p-3 mb-2">
          <button onClick={()=>openTicket(t.id)} className="text-xs font-mono text-violet-600 hover:underline">{t.nomor}</button>
          <div className="font-medium text-sm">{t.judul}</div>
          <div className="text-xs text-slate-500 mb-1">{t.pelapor.nama} · {t.kelurahan}</div>
          {t.pigura.tanggal_pesan && <div className="text-xs text-slate-600">📦 Pesan: {fmtTanggal(t.pigura.tanggal_pesan)}</div>}
          {t.pigura.tanggal_serah && <div className="text-xs text-emerald-600">✅ Diserahkan: {fmtTanggal(t.pigura.tanggal_serah)}</div>}
          {currentUser.peran === 'pigura' && actLabel && (
            <button onClick={() => advance(t.id)} className="mt-2 w-full py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded text-xs">{actLabel}</button>
          )}
        </div>
      ))}
    </div>
  );
  return (
    <div className="space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-800">Antrian Pigura</h1>
        <p className="text-slate-600 text-sm">Tracking pembuatan dan serah-terima pigura ke warga</p>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
        <Col title="Disetujui"   items={groups.disetujui}  badge="bg-slate-100 text-slate-600"  actLabel="→ Pesan ke Vendor" />
        <Col title="Dipesan"     items={groups.dipesan}    badge="bg-amber-100 text-amber-700"  actLabel="→ Tandai Diterima" />
        <Col title="Diterima"    items={groups.diterima}   badge="bg-sky-100 text-sky-700"      actLabel="→ Serahkan ke Warga" />
        <Col title="Diserahkan"  items={groups.diserahkan} badge="bg-emerald-100 text-emerald-700" />
      </div>
    </div>
  );
}

function BotSimulator({ store, update, currentUser, openTicket }) {
  const [sendAs, setSendAs] = useState('budi');
  const [draft, setDraft] = useState('');
  const scrollRef = useRef(null);

  const messages = store.botMessages || [];
  const senderUsers = USERS.filter(u => ['pic','pj_kecamatan','koordinator','admin_kantor','lo_dinas'].includes(u.peran));
  const sender = USERS.find(u => u.id === sendAs);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages.length]);

  const examples = [
    '#LAPOR PJU mati 3 titik di Duri Kepa RT 04, sudah 2 hari',
    '#LAPOR Sampah menumpuk di TPS Slipi, bau menyengat',
    '#LAPOR Banjir di RT 02 Joglo, sudah 30 cm air masuk rumah',
    '#LAPOR KTP tertahan di kelurahan Kemanggisan, sudah 3 minggu',
    '#STATUS LI-2026-0001',
    'menu',
  ];

  const clearLog = () => {
    if (!confirm('Hapus semua riwayat percakapan bot?')) return;
    update(s => { s.botMessages = []; });
  };

  const send = () => {
    if (!draft.trim()) return;
    const body = draft;
    const now = new Date().toISOString();
    update(s => {
      if (!s.botMessages) s.botMessages = [];
      const senderUser = USERS.find(u => u.id === sendAs);
      // Add incoming PIC message
      s.botMessages.push({
        id:`m-${Date.now()}-in`, ts: now, from:'pic',
        userId: senderUser.id, userNomor: senderUser.nomor_wa, userName: senderUser.nama,
        userLabel: senderUser.label, body,
      });

      const parsed = parseWaMessage(body, senderUser);
      let replyBody = '';
      let ticketCreated = null;

      if (parsed.type === 'intake') {
        const counter = s.counter;
        const nowDate = new Date();
        const kat = KATEGORI.find(k => k.id === parsed.kategori);
        const slaTarget = new Date(nowDate); slaTarget.setDate(nowDate.getDate() + kat.sla);
        const assignee = senderUser.peran === 'pic' ? senderUser.id : null;
        const newTiket = {
          id: `t${counter.toString().padStart(4,'0')}`,
          nomor: `LI-2026-${counter.toString().padStart(4,'0')}`,
          judul: parsed.judul, deskripsi: parsed.deskripsi,
          kategori: parsed.kategori,
          kecamatan: parsed.kecamatan, kelurahan: parsed.kelurahan,
          alamat: '', pelapor: { nama: senderUser.nama + ' (via Bot WA)', hp: senderUser.nomor_wa },
          kanal: 'Bot WA', status: assignee ? 'Verifikasi Lapangan' : 'Triase', prioritas: parsed.prioritas,
          flag_pigura: false, koordinat: null,
          tanggal_masuk: nowDate.toISOString(), sla_target: slaTarget.toISOString(),
          tanggal_selesai: null, assignee, pencatat: senderUser.id,
          timeline: [{
            id:`a-${counter}-1`, tipe:'create', user:senderUser.id,
            desc:`Aduan tercatat otomatis via Bot WA dari ${senderUser.nomor_wa}`, ts: nowDate.toISOString()
          }],
          poinList: [], sosmed:null, pigura:null, lampiran: [],
        };
        s.tickets.unshift(newTiket);
        s.counter += 1;
        ticketCreated = newTiket;
        replyBody = `✅ Aduan tercatat sebagai ${newTiket.nomor}\n\n📝 ${newTiket.judul}\n📍 ${newTiket.kelurahan}, ${newTiket.kecamatan}\n🏷️ Kategori: ${kat.nama}\n⚡ Prioritas: ${newTiket.prioritas}\n📊 Status: ${newTiket.status}\n📅 SLA: ${kat.sla} hari kerja\n\n${assignee ? 'Otomatis di-assign ke Anda sebagai PIC area. Silakan check-in di lokasi untuk dapat 5 poin.' : 'Akan di-triase Koordinator dalam waktu dekat.'}`;
      } else if (parsed.type === 'status_query') {
        const t = s.tickets.find(x => x.nomor === parsed.ticketNomor);
        if (t) {
          const lastAction = (t.timeline||[]).slice(-1)[0];
          replyBody = `📋 ${t.nomor}\n${t.judul}\n\n📍 ${t.kelurahan}, ${t.kecamatan}\n📊 Status: ${t.status}\n👤 Assignee: ${t.assignee ? USERS.find(u=>u.id===t.assignee)?.nama : 'Belum di-assign'}\n📅 SLA: ${fmtTanggal(t.sla_target)}\n🕒 Update terakhir: ${lastAction ? fmtTanggal(lastAction.ts) : '-'}`;
        } else {
          replyBody = `❌ Nomor tiket ${parsed.ticketNomor} tidak ditemukan dalam sistem.`;
        }
      } else if (parsed.type === 'update') {
        const t = s.tickets.find(x => x.nomor === parsed.ticketNomor);
        if (!t) {
          replyBody = `❌ Nomor tiket ${parsed.ticketNomor} tidak ditemukan.`;
        } else {
          t.timeline.push({ id:`a-${Date.now()}`, tipe:'note', user:senderUser.id, desc:`Update via Bot WA: ${parsed.note.substring(0,150)}`, ts:new Date().toISOString() });
          if (parsed.isSelesai) {
            t.status = 'Selesai'; t.tanggal_selesai = new Date().toISOString();
            replyBody = `✅ Status ${t.nomor} diubah menjadi Selesai.\n\nKonfirmasi otomatis akan dikirim ke pelapor.`;
          } else {
            replyBody = `📝 Catatan tercatat di tiket ${t.nomor}.`;
          }
        }
      } else if (parsed.type === 'menu') {
        replyBody = `🤖 LaporIma Bot — Panduan\n\nFormat pesan yang dikenali:\n\n📝 #LAPOR [judul aduan]\n   Contoh: #LAPOR Lampu PJU mati di Duri Kepa RT 04\n   Bot deteksi kategori & lokasi otomatis.\n\n📋 #STATUS LI-2026-XXXX\n   Cek status tiket.\n\n🔄 #UPDATE LI-2026-XXXX selesai\n   Update status tiket.\n\nNomor Anda terdaftar atas nama: ${senderUser.nama} (${senderUser.label}).`;
      } else {
        replyBody = `🤖 Pesan tidak dikenali.\n\nMohon awali dengan #LAPOR untuk aduan baru, #STATUS untuk cek tiket, atau ketik "menu" untuk panduan.`;
      }

      s.botMessages.push({
        id:`m-${Date.now()}-out`, ts: new Date().toISOString(), from:'bot',
        body: replyBody, ticketId: ticketCreated?.id, ticketNomor: ticketCreated?.nomor,
      });
    });
    setDraft('');
  };

  const botTickets = store.tickets.filter(t => t.kanal === 'Bot WA');

  return (
    <div className="space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">🤖 Bot WA Simulator</h1>
        <p className="text-slate-600 text-sm">
          Simulasi cara Bot WA menerima pesan dari tim lapangan dan otomatis membuat tiket.
          Nomor bot: <span className="font-mono font-semibold">0811-8055-155</span>
        </p>
      </div>

      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
        <div className="text-sm font-semibold text-amber-800 mb-2">💡 Coba contoh pesan (klik untuk pakai):</div>
        <div className="flex flex-wrap gap-2">
          {examples.map((e, i) => (
            <button key={i} onClick={() => setDraft(e)} className="text-xs px-2.5 py-1 bg-white rounded-lg border border-amber-300 hover:bg-amber-100 text-left max-w-xs truncate">
              {e}
            </button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 bg-emerald-50 rounded-xl border border-emerald-200 overflow-hidden flex flex-col" style={{minHeight:520}}>
          <div className="bg-emerald-700 text-white px-4 py-2 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-2xl">🤖</span>
              <div>
                <div className="font-semibold">LaporIma Bot</div>
                <div className="text-xs opacity-80">0811-8055-155 · Online · {messages.length} pesan</div>
              </div>
            </div>
            <button onClick={clearLog} className="text-xs px-2 py-1 bg-emerald-800 hover:bg-emerald-900 rounded">Clear Log</button>
          </div>
          <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-2" style={{maxHeight:440}}>
            {messages.length === 0 && (
              <div className="text-center text-slate-500 italic mt-12 text-sm">
                Belum ada pesan. Coba klik salah satu contoh di atas, lalu Send.
              </div>
            )}
            {messages.map(m => (
              <div key={m.id} className={`flex ${m.from === 'bot' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] rounded-lg px-3 py-2 ${m.from === 'bot' ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-200'}`}>
                  {m.from === 'pic' && (
                    <div className="text-xs font-semibold mb-1 text-emerald-700">
                      {m.userName} <span className="font-normal text-slate-500">· {m.userLabel} · </span><span className="font-mono">{m.userNomor}</span>
                    </div>
                  )}
                  <div className={`whitespace-pre-wrap text-sm ${m.from === 'bot' ? 'text-white' : 'text-slate-800'}`}>{m.body}</div>
                  {m.ticketNomor && (
                    <button onClick={() => openTicket(m.ticketId)} className="mt-1.5 text-xs bg-white/20 hover:bg-white/30 rounded px-2 py-0.5">
                      Lihat tiket {m.ticketNomor} ↗
                    </button>
                  )}
                  <div className={`text-[10px] mt-1 opacity-70 ${m.from === 'bot' ? 'text-white' : 'text-slate-500'}`}>
                    {fmtTanggalJam(m.ts)}
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="p-3 bg-white border-t border-slate-200">
            <div className="mb-2 flex items-center gap-2 flex-wrap">
              <span className="text-xs text-slate-600">Kirim sebagai:</span>
              <select value={sendAs} onChange={e => setSendAs(e.target.value)} className="text-xs px-2 py-1 border border-slate-200 rounded">
                {senderUsers.map(u => (
                  <option key={u.id} value={u.id}>{u.nama} — {u.label} ({u.nomor_wa})</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2">
              <textarea value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) send();}} placeholder="Ketik pesan WA seperti tim lapangan biasa... (Ctrl+Enter untuk kirim)" rows={2} className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm resize-none" />
              <button onClick={send} disabled={!draft.trim()} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white rounded-lg font-medium self-stretch">Send</button>
            </div>
          </div>
        </div>

        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold mb-2 text-sm">📊 Bot Statistik</h3>
            <div className="grid grid-cols-2 gap-2 text-sm">
              <div className="p-2 bg-emerald-50 rounded">
                <div className="text-xs text-slate-600">Total pesan</div>
                <div className="text-2xl font-bold text-emerald-700">{messages.length}</div>
              </div>
              <div className="p-2 bg-rose-50 rounded">
                <div className="text-xs text-slate-600">Tiket via Bot</div>
                <div className="text-2xl font-bold text-rose-700">{botTickets.length}</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold mb-2 text-sm">📞 Mapping Nomor HP</h3>
            <div className="space-y-1 text-xs max-h-56 overflow-y-auto">
              {senderUsers.map(u => (
                <div key={u.id} className="flex items-center justify-between p-1.5 bg-slate-50 rounded">
                  <span className="font-mono text-slate-600 text-[10px]">{u.nomor_wa}</span>
                  <span className="font-medium text-right">{u.nama}<br/><span className="text-slate-500 font-normal">{u.label}</span></span>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-semibold mb-2 text-sm">📝 Format Pesan</h3>
            <div className="space-y-2 text-xs">
              <div>
                <div className="font-mono bg-emerald-50 text-emerald-800 p-1.5 rounded text-[11px]">#LAPOR [aduan]</div>
                <div className="text-slate-600 mt-0.5">Catat aduan baru. Bot ekstrak kategori, kelurahan, prioritas dari teks.</div>
              </div>
              <div>
                <div className="font-mono bg-sky-50 text-sky-800 p-1.5 rounded text-[11px]">#STATUS LI-2026-XXXX</div>
                <div className="text-slate-600 mt-0.5">Cek status tiket tertentu.</div>
              </div>
              <div>
                <div className="font-mono bg-amber-50 text-amber-800 p-1.5 rounded text-[11px]">#UPDATE LI-2026-XXXX selesai</div>
                <div className="text-slate-600 mt-0.5">Update status tiket (selesai/catatan).</div>
              </div>
              <div>
                <div className="font-mono bg-slate-50 text-slate-700 p-1.5 rounded text-[11px]">menu</div>
                <div className="text-slate-600 mt-0.5">Tampilkan panduan format.</div>
              </div>
            </div>
          </div>

          <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-800">
            <div className="font-semibold mb-1">ℹ️ Catatan Implementasi Produksi</div>
            <p>Di sistem produksi, bot ini berjalan di server (Node.js) terhubung ke <strong>WA Gateway</strong> (Fonnte / Wablas / Meta Official). Saat tim lapangan kirim pesan WA, gateway forward via webhook ke sistem, parse, auto-create tiket, dan reply otomatis.</p>
            <p className="mt-1">Estimasi biaya: Rp 200rb–800rb/bulan tergantung pilihan.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

// ========== HELP MODAL ==========
function HelpModal({ onClose }) {
  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-5 border-b border-slate-200 flex items-center justify-between">
          <h2 className="font-bold text-lg">Panduan Demo LaporIma</h2>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-800 text-2xl leading-none">×</button>
        </div>
        <div className="p-5 space-y-4 text-sm text-slate-700">
          <div>
            <h3 className="font-semibold text-slate-800 mb-1">Apa ini?</h3>
            <p>Prototype interaktif sistem manajemen aduan untuk Tim Bu Ima Mahdiah, Dapil 10 Jakarta Barat (Kebon Jeruk, Grogol Petamburan, Tamansari, Kembangan, Palmerah). Data tersimpan di browser ini saja.</p>
          </div>
          <div>
            <h3 className="font-semibold text-slate-800 mb-1">Lapisan Akses</h3>
            <ul className="list-disc pl-5 space-y-1">
              <li><strong>Office Tier</strong> (dashboard penuh): Owner, Koordinator, Admin Kantor, Tim Medsos, Super Admin</li>
              <li><strong>Field Tier</strong> (hanya data lapangan, tanpa dashboard sosmed): PJ Kecamatan, PIC, LO Dinas</li>
              <li><strong>Spesialisasi</strong>: Tim Pigura (modul pigura)</li>
            </ul>
          </div>
          <div>
            <h3 className="font-semibold text-slate-800 mb-1">Cara mencoba</h3>
            <ol className="list-decimal pl-5 space-y-1">
              <li>Klik <strong>avatar pojok kanan atas</strong> untuk ganti peran. User dikelompokkan sesuai tier.</li>
              <li>Coba sebagai <strong>Bu Ima (Owner)</strong> → lihat dashboard penuh + KPI Sosmed/Pigura.</li>
              <li>Coba sebagai <strong>Pak Hadi (PJ Kebon Jeruk)</strong> → dashboard hanya tampilkan data Kecamatan Kebon Jeruk, menu Sosmed/Pigura tidak ada.</li>
              <li>Coba sebagai <strong>Pak Budi (PIC Kebon Jeruk)</strong> → lihat tiket area-nya, klik Check-in GPS, upload foto, ubah status.</li>
              <li>Coba sebagai <strong>Mbak Lia (Koordinator)</strong> → approve poin pending dari tim lapangan.</li>
              <li>Coba sebagai <strong>Sari (Tim Sosmed)</strong> → lihat antrian dokumentasi pasca-selesai.</li>
            </ol>
          </div>
          <div className="text-xs text-slate-500">
            Klik "Reset" di banner kuning untuk kembali ke 30 tiket contoh awal.
          </div>
        </div>
      </div>
    </div>
  );
}

// ========== RENDER ==========
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
